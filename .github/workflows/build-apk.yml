name: Build MEGA Downloader APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ant \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            g++ \
            gcc \
            git \
            libffi-dev \
            libltdl-dev \
            libssl-dev \
            libtool \
            libtool-bin \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            make \
            pkg-config \
            unzip \
            wget \
            zip \
            zlib1g-dev \
            gettext

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

      - name: Install Buildozer
        run: |
          python -m pip install buildozer
          python -m pip install "cython==0.29.34"

      - name: Show build tools
        run: |
          echo "===== PYTHON ====="
          python --version

          echo "===== JAVA ====="
          java -version

          echo "===== BUILDOZER ====="
          buildozer --version

          echo "===== CYTHON ====="
          cython --version

          echo "===== AUTOCONF ====="
          autoconf --version

          echo "===== AUTOMAKE ====="
          automake --version

          echo "===== LIBTOOL ====="
          libtool --version

      - name: Accept Android SDK license
        run: |
          mkdir -p ~/.buildozer
          touch ~/.buildozer/android.accept_sdk_license

      - name: Build APK
        run: |
          buildozer android debug

      - name: List generated files
        if: always()
        run: |
          echo "===== BIN DIRECTORY ====="

          if [ -d "bin" ]; then
            ls -lah bin/
          else
            echo "bin directory was not created."
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MEGA-Downloader-APK
          path: bin/*.apk
          if-no-files-found: error
