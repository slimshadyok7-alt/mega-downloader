name: Build MEGA Downloader APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install required Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            gettext \
            zip \
            unzip

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Buildozer
        run: |
          python -m pip install buildozer
          python -m pip install "cython==0.29.34"

      - name: Show build tools
        run: |
          python --version
          java -version
          buildozer --version

      - name: Accept Android SDK license
        run: |
          mkdir -p ~/.buildozer
          touch ~/.buildozer/android.accept_sdk_license

      - name: Build APK
        run: |
          buildozer android debug

      - name: List generated files
        if: always()
        run: |
          echo "===== BIN DIRECTORY ====="
          find bin -maxdepth 2 -type f -print 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MEGA-Downloader-APK
          path: bin/*.apk
          if-no-files-found: error
